<!DOCTYPE html>
<html>
<head>
<title>AI App Compiler</title>

<style>

body{
font-family:Arial;
padding:30px;
background:#f2f2f2;
}

textarea{
width:100%;
height:120px;
padding:10px;
}

button{
padding:10px;
margin-top:10px;
cursor:pointer;
}

pre{
background:white;
padding:20px;
margin-top:20px;
overflow:auto;
}

</style>

</head>

<body>

<h1>AI App Compiler Demo</h1>

<textarea
id="prompt"
placeholder="Build CRM with login and payments">
</textarea>

<br>

<button onclick="generate()">
Generate
</button>

<pre id="output"></pre>

<script>

async function generate(){

const prompt=
document.getElementById(
"prompt"
).value;

const response=
await fetch(
"http://localhost:3000/generate",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
input:prompt
})

}

);

const data=
await response.json();

document.getElementById(
"output"
).innerText=
JSON.stringify(
data,
null,
2
);

}

</script>

</body>
</html>
